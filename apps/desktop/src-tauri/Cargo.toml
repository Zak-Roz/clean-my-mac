[package]
name = "cmm-desktop"
description = "clean-my-mac desktop app (Tauri shell over cmm-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "cmm_desktop_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chrono.workspace = true
cmm-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }

[dev-dependencies]
tempfile.workspace = true

# Downloads tab previews: QuickLook thumbnails (QLThumbnailGenerator) encoded as PNG.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "QLThumbnailGenerationRequest", "QLThumbnailGenerator", "QLThumbnailRepresentation"] }
