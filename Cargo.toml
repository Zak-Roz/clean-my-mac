[workspace]
resolver = "3"
members = ["crates/cmm-core", "crates/cmm-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
cmm-core = { path = "crates/cmm-core" }

anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
glob = "0.3.3"
libc = "0.2.177"
rayon = "1.11"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3.23"
thiserror = "2.0.17"
toml = "1.2"
trash = "5.2"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl", "no-serde-warnings"] }
walkdir = "2.5"

tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
