# ─── Xcode ──────────────────────────────────────────────────────────────────

[[rule]]
id = "xcode.derived-data"
title = "Xcode DerivedData"
description = "Build products and indexes of Xcode projects. Rebuilt on the next build (slower first build)."
category = "xcode"
risk = "safe"
detector = "paths"
roots = ["~/Library/Developer/Xcode/DerivedData"]
action = "trash"
requires_quit = ["Xcode"]
regenerates = true

[[rule]]
id = "xcode.caches"
title = "Xcode caches"
description = "Xcode's own caches (documentation, downloads metadata). Rebuilt automatically."
category = "xcode"
risk = "safe"
detector = "paths"
roots = ["~/Library/Caches/com.apple.dt.Xcode"]
action = "trash"
requires_quit = ["Xcode"]
regenerates = true

[[rule]]
id = "xcode.archives"
title = "Xcode archives"
description = "App archives created for distribution, with the debug symbols needed to read crash reports of those builds. Not recreated."
category = "xcode"
risk = "manual"
detector = "paths"
roots = ["~/Library/Developer/Xcode/Archives"]
action = "trash"

[[rule]]
id = "xcode.device-support"
title = "Device support files"
description = "Debug symbols copied from each iPhone/Watch/TV OS version you connected. Copied again when such a device is connected for debugging."
category = "xcode"
risk = "review"
detector = "paths"
roots = [
  "~/Library/Developer/Xcode/iOS DeviceSupport/*",
  "~/Library/Developer/Xcode/watchOS DeviceSupport/*",
  "~/Library/Developer/Xcode/tvOS DeviceSupport/*",
  "~/Library/Developer/Xcode/visionOS DeviceSupport/*",
]
action = "trash"
requires_quit = ["Xcode"]
regenerates = true

[[rule]]
id = "xcode.coresimulator-caches"
title = "Simulator caches"
description = "Dyld and asset caches of the iOS Simulator. Rebuilt the next time a simulator boots."
category = "xcode"
risk = "safe"
detector = "paths"
roots = ["~/Library/Developer/CoreSimulator/Caches"]
action = "trash"
requires_quit = ["Simulator"]
regenerates = true

[[rule]]
id = "xcode.simulator-runtimes"
title = "Unusable or duplicate simulator runtimes"
description = "Simulator runtimes that are unusable or installed twice, removed with `xcrun simctl runtime delete`, plus simulators whose runtime is gone (`xcrun simctl delete unavailable`). Re-download a runtime from Xcode > Settings > Components."
category = "xcode"
risk = "review"
detector = "simulator-runtimes"
action = "command"
requires_quit = ["Simulator"]

# ─── Downloads ──────────────────────────────────────────────────────────────

[[rule]]
id = "downloads.installers"
title = "Old installers"
description = "Disk images and installer packages (.dmg, .pkg, .iso, .xip) older than a week. The installed apps keep working; download the installer again if you need it."
category = "downloads"
risk = "review"
detector = "installers"
roots = ["~/Downloads"]
action = "trash"

[[rule]]
id = "downloads.redundant-archives"
title = "Already-extracted archives"
description = "Archives (.zip, .tar.gz, .rar, .7z) whose extracted folder or app sits next to them. The extracted copy stays; the archive itself is not recreated."
category = "downloads"
risk = "review"
detector = "redundant-archives"
roots = ["~/Downloads"]
action = "trash"

[[rule]]
id = "downloads.versioned-siblings"
title = "Older versions of the same download"
description = "Files and folders that differ only by a date or version in the name (DB dumps, exports, backups). The newest is kept; older versions are not recreated."
category = "downloads"
risk = "manual"
detector = "versioned-siblings"
roots = ["~/Downloads"]
action = "trash"

[rule.params]
depth = 3

[[rule]]
id = "downloads.old-files"
title = "Old downloads"
description = "Items in Downloads not opened or modified for 30 days. Review before removing; they are not recreated."
category = "downloads"
risk = "manual"
detector = "older-than"
roots = ["~/Downloads"]
action = "trash"

[rule.params]
days = 30

# Browse-only: never part of a default, category or background scan; the Downloads tab scans it by id.
[[rule]]
id = "downloads.browse"
title = "Everything in Downloads"
description = "Every file and folder at the top of Downloads, for the Downloads tab to sort, preview and pick from. Removed items are not recreated."
category = "downloads"
risk = "manual"
detector = "entries"
roots = ["~/Downloads"]
action = "trash"
browse_only = true

[rule.params]
min_bytes = 0

# ─── Development ────────────────────────────────────────────────────────────

[[rule]]
id = "dev.stale-artifacts"
title = "Build artifacts of inactive projects"
description = "node_modules, target, build output and virtualenvs of projects with no file change and no commit for 60 days. Recreated by the project's install/build command."
category = "dev-artifacts"
risk = "review"
detector = "stale-artifacts"
roots = ["~/Developer"]
action = "trash"
regenerates = true

[rule.params]
names = [
  "node_modules",
  "target",
  ".next",
  "dist",
  "build",
  "DerivedData",
  ".turbo",
  ".venv",
  "Pods",
  ".gradle",
  ".nuxt",
  ".svelte-kit",
  ".parcel-cache",
  ".angular",
]

[[rule]]
id = "dev.git-worktrees"
title = "Git worktrees"
description = "Linked git worktrees (e.g. from Claude Code) and leftover worktree folders. Removed with `git worktree remove`; the branch and its commits stay in the repository."
category = "worktrees"
risk = "review"
detector = "git-worktrees"
roots = ["~/Developer"]
action = "git-worktree-remove"

# ─── Containers ─────────────────────────────────────────────────────────────

[[rule]]
id = "containers.docker"
title = "Docker unused data"
description = "Stopped containers, dangling images and build cache, removed with `docker system prune -f` (volumes and tagged images are never touched). Docker Desktop returns the space to macOS gradually."
category = "containers"
risk = "review"
detector = "docker"
roots = ["~/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw"]
action = "command"

