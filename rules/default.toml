# Built-in rule catalog, embedded into cmm-core with include_str!.
# Format and detector semantics: docs/ARCHITECTURE.md §4. Keys are snake_case.
#
# risk:   safe   = regenerates by itself, preselected
#         review = probably unneeded, the user ticks it
#         manual = shown, never preselected (dumps, documents, media, models)
# Every description says what is lost and whether it comes back.
# Globs: `*` matches within one path segment; braces are not supported.

# ─── AI tools ────────────────────────────────────────────────────────────────

[[rule]]
id = "ai.claude-desktop.vm-bundles"
title = "Claude Desktop VM bundle"
description = "Linux VM used by Claude Desktop for code execution. Recreated on demand (~10 GB download)."
category = "ai-tools"
risk = "review"
detector = "paths"
roots = [
  "~/Library/Application Support/Claude/vm_bundles",
  "~/Library/Application Support/ai-profiles/profiles/*/gui-data/vm_bundles",
]
action = "trash"
requires_quit = ["Claude"]
regenerates = true

[[rule]]
id = "ai.claude-desktop.caches"
title = "Claude Desktop web caches"
description = "Chromium HTTP, code and GPU caches of Claude Desktop (and each ai-profiles profile). Rebuilt automatically; the first launch is a little slower."
category = "ai-tools"
risk = "safe"
detector = "paths"
roots = [
  "~/Library/Application Support/Claude/Cache",
  "~/Library/Application Support/Claude/Code Cache",
  "~/Library/Application Support/Claude/GPUCache",
  "~/Library/Application Support/ai-profiles/profiles/*/gui-data/Cache",
  "~/Library/Application Support/ai-profiles/profiles/*/gui-data/Code Cache",
  "~/Library/Application Support/ai-profiles/profiles/*/gui-data/GPUCache",
]
action = "trash"
requires_quit = ["Claude"]
regenerates = true

[[rule]]
id = "ai.ai-profiles.migration-backups"
title = "ai-profiles migration backup"
description = "Copy of your Claude profiles made when ai-profiles migrated them. Not needed once the profiles work; it is not recreated."
category = "ai-tools"
risk = "review"
detector = "paths"
roots = ["~/Library/Application Support/ai-profiles/migration-backup-*"]
action = "trash"
requires_quit = ["Claude"]

# One finding per session log (or session folder) inside each project folder, never the project
# folder itself: it also holds the user's curated `memory/`, which is excluded by name.
[[rule]]
id = "ai.claude-code.transcripts"
title = "Old Claude Code transcripts"
description = "Claude Code conversation logs (5 MB or more) not used for 30 days, grouped by project. Those sessions can no longer be resumed (`claude --resume`); they are not recreated. Project memory (`memory/`) is never touched."
category = "ai-tools"
risk = "review"
detector = "older-than"
roots = [
  "~/.claude/projects/*",
  "~/Library/Application Support/ai-profiles/profiles/*/cli-config/projects/*",
]
action = "trash"

[rule.params]
days = 30
exclude = ["memory"]
group_by_root = true
min_bytes = 5242880 # 5 MiB, replaces the global minimum for this rule

[[rule]]
id = "ai.claude-code.debug-logs"
title = "Claude Code debug logs"
description = "Debug logs written by Claude Code. Only useful for bug reports; new logs are written as needed."
category = "ai-tools"
risk = "safe"
detector = "paths"
roots = [
  "~/.claude/debug",
  "~/Library/Application Support/ai-profiles/profiles/*/cli-config/debug",
]
action = "trash"
regenerates = true

[[rule]]
id = "ai.claude-code.old-versions"
title = "Old Claude Code versions"
description = "Previous Claude Code builds kept by the native installer. The two newest are kept; older ones are not needed to run Claude Code and are not recreated."
category = "ai-tools"
risk = "review"
detector = "versioned-siblings"
roots = ["~/.local/share/claude/versions"]
action = "trash"

[rule.params]
keep = 2
depth = 1

[[rule]]
id = "ai.claude-desktop.claude-code-versions"
title = "Old Claude Code versions (Claude Desktop)"
description = "Claude Code builds downloaded by Claude Desktop (host and VM builds, per profile). The two newest are kept; Claude Desktop downloads a version again if it needs it."
category = "ai-tools"
risk = "review"
detector = "versioned-siblings"
roots = [
  "~/Library/Application Support/Claude/claude-code",
  "~/Library/Application Support/Claude/claude-code-vm",
  "~/Library/Application Support/ai-profiles/profiles/*/gui-data/claude-code",
  "~/Library/Application Support/ai-profiles/profiles/*/gui-data/claude-code-vm",
]
action = "trash"
requires_quit = ["Claude"]
regenerates = true

[rule.params]
keep = 2
depth = 1

[[rule]]
id = "ai.codex.sessions"
title = "Old Codex sessions"
description = "Codex CLI conversation logs (per month) older than 30 days. Those sessions can no longer be resumed; they are not recreated."
category = "ai-tools"
risk = "review"
detector = "older-than"
roots = ["~/.codex/sessions/*"]
action = "trash"

[rule.params]
days = 30

[[rule]]
id = "ai.codex.logs-db"
title = "Codex log database"
description = "Codex's internal log database (logs_*.sqlite and its -wal/-shm files). Diagnostic only; Codex starts a new one."
category = "ai-tools"
risk = "safe"
detector = "paths"
roots = ["~/.codex/logs_*.sqlite*"]
action = "trash"
requires_quit = ["codex", "Codex"]
regenerates = true

[[rule]]
id = "ai.codex.runtimes"
title = "Codex runtimes cache"
description = "Tool runtimes Codex downloads for running commands. Downloaded again the next time Codex needs them."
category = "ai-tools"
risk = "safe"
detector = "paths"
roots = ["~/.cache/codex-runtimes"]
action = "trash"
requires_quit = ["codex", "Codex"]
regenerates = true

[[rule]]
id = "ai.codex.old-versions"
title = "Old Codex versions"
description = "Previous Codex CLI releases from the standalone installer. The two newest are kept (`current` points at the newest); older ones are not recreated."
category = "ai-tools"
risk = "review"
detector = "versioned-siblings"
roots = ["~/.codex/packages/standalone/releases"]
action = "trash"
requires_quit = ["codex", "Codex"]

[rule.params]
keep = 2
depth = 1

[[rule]]
id = "ai.gemini.tmp"
title = "Old Gemini CLI temp data"
description = "Per-project chat checkpoints and temp files of Gemini CLI not used for 30 days. Those checkpoints are lost; new ones are written as you work."
category = "ai-tools"
risk = "review"
detector = "older-than"
roots = ["~/.gemini/tmp"]
action = "trash"

[rule.params]
days = 30

[[rule]]
id = "ai.cursor.caches"
title = "Cursor caches"
description = "Chromium caches, cached VS Code data and downloaded extension packages of Cursor. Rebuilt automatically; settings and extensions stay."
category = "ai-tools"
risk = "safe"
detector = "paths"
roots = [
  "~/Library/Application Support/Cursor/Cache",
  "~/Library/Application Support/Cursor/CachedData",
  "~/Library/Application Support/Cursor/Code Cache",
  "~/Library/Application Support/Cursor/GPUCache",
  "~/Library/Application Support/Cursor/CachedExtensionVSIXs",
  "~/Library/Caches/com.todesktop.230313mzl4w4u92",
]
action = "trash"
requires_quit = ["Cursor"]
regenerates = true

[[rule]]
id = "ai.local-models"
title = "Local AI models"
description = "Downloaded model weights (Ollama, LM Studio, Hugging Face hub, Whisper). Not recreated by themselves: re-downloading can take many GB and hours."
category = "ai-tools"
risk = "manual"
detector = "paths"
roots = [
  "~/.ollama/models",
  "~/.lmstudio/models",
  "~/.cache/huggingface",
  "~/.cache/whisper",
]
action = "trash"
requires_quit = ["ollama", "Ollama", "LM Studio"]

